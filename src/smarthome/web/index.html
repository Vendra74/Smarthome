<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151515" media="(prefers-color-scheme: dark)">
  <title>Central da Casa</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1 id="home-name">Casa</h1>
    <button id="add-device" class="ghost" type="button">Adicionar</button>
  </header>

  <section class="assistant" aria-label="Assistente">
    <form id="ask-form" class="ask">
      <button id="mic" class="mic" type="button" aria-label="Falar com a central" title="Falar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z"/></svg>
      </button>
      <input id="ask-input" type="text" autocomplete="off" placeholder="Acende a luz da sala..." aria-label="Pedido para a central">
      <button class="send" type="submit">Enviar</button>
    </form>
    <p id="reply" class="reply" aria-live="polite"></p>
  </section>

  <nav id="rooms" class="rooms" aria-label="Cômodos"></nav>
  <main id="devices" class="devices"></main>
  <p id="empty" class="empty" hidden>Nenhum dispositivo cadastrado ainda. Use "Adicionar" ou peça por voz: "configura a luz nova da cozinha".</p>

  <dialog id="add-dialog">
    <form id="add-form" method="dialog">
      <h2>Adicionar dispositivo</h2>
      <div id="discovered"></div>
      <label>Nome <input name="name" required placeholder="Luz da cozinha"></label>
      <label>Cômodo <input name="room" list="room-list" placeholder="cozinha"></label>
      <datalist id="room-list"></datalist>
      <label>Tipo
        <select name="type">
          <option value="light">Luz</option>
          <option value="tv">TV</option>
          <option value="ac">Ar-condicionado</option>
          <option value="switch">Tomada / interruptor</option>
          <option value="other">Outro</option>
        </select>
      </label>
      <label>Integração
        <select name="adapter">
          <option value="smartthings">SmartThings</option>
          <option value="samsung_tv">TV Samsung (rede local)</option>
          <option value="lg_tv">TV LG (rede local)</option>
          <option value="virtual">Virtual (teste)</option>
        </select>
      </label>
      <div class="tv-fields">
        <label>IP da TV <input name="host" placeholder="192.168.0.50"></label>
        <label>MAC da TV <input name="mac" placeholder="AA:BB:CC:DD:EE:FF"></label>
      </div>
      <input type="hidden" name="device_id">
      <p id="add-error" class="error" hidden></p>
      <menu>
        <button type="button" class="ghost" id="add-cancel">Cancelar</button>
        <button type="submit" value="save">Salvar</button>
      </menu>
    </form>
  </dialog>

  <template id="device-card">
    <article class="card">
      <header>
        <span class="icon" aria-hidden="true"></span>
        <div class="title">
          <h3></h3>
          <p class="status"></p>
        </div>
        <label class="switch"><input type="checkbox" class="power"><span></span></label>
      </header>
      <div class="controls"></div>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
