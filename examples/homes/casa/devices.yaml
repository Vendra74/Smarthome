# Exemplo da casa de referência. Copie a pasta para data/homes/casa e ajuste.
# Os dispositivos "virtual" servem para testar a central sem hardware.
devices:
  - id: luz-sala
    name: Luz da sala
    room: sala
    type: light
    adapter: virtual
    aliases: [luz principal]
  - id: ar-quarto
    name: Ar do quarto
    room: quarto
    type: ac
    adapter: virtual
  # Lâmpada ou ar-condicionado cadastrado no app SmartThings
  # - id: luz-cozinha
  #   name: Luz da cozinha
  #   room: cozinha
  #   type: light
  #   adapter: smartthings
  #   config: {device_id: "<id do SmartThings>"}
  # TV Samsung pela rede local
  # - id: tv-sala
